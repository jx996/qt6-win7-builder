name: Build Qt 6 for Windows 7

# 手动触发：运行时填写要编译的 Qt 版本号，产物以 <版本号>_Windows7.tar.gz 命名
# 并自动发布到 Releases。
on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt 版本号（必填），例如 6.8.4 / 6.10.3'
        required: true
        default: '6.8.4'
        type: string
      patch_ref:
        description: 'Win7 补丁仓库 crystalidea/qt6windows7 的分支 / tag / commit'
        required: false
        default: 'master'
        type: string
      arch:
        description: '目标架构'
        required: false
        default: 'x64'
        type: choice
        options: [x64, x86]
      build_type:
        description: '构建类型。Qt 默认编译为动态库(shared/.dll)，如需静态库请改用自托管 runner 并修改 Configure-Qt。release 即可满足大部分需求；debug-and-release 耗时翻倍且需要极大磁盘'
        required: false
        default: 'release'
        type: choice
        options: [debug-and-release, release, debug]
      module_preset:
        description: '模块集（base=仅 qtbase；essential=常用桌面模块；all=全部社区开源模块，不含商业模块）。默认 all'
        required: false
        default: 'all'
        type: choice
        options: [all, essential, base]
      extra_modules:
        description: '额外要编译的模块，空格分隔（在模块集基础上追加；默认已列出全部社区版模块）'
        required: false
        default: 'qtbase qtdeclarative qtshadertools qttools qtsvg qtimageformats qt5compat qtactiveqt qtcharts qtdatavis3d qtgraphs qt3d qtquick3d qtquick3dphysics qtquicktimeline qtquickeffectmaker qtlottie qtnetworkauth qtcoap qtmqtt qtopcua qtgrpc qthttpserver qtlanguageserver qtscxml qtremoteobjects qtserialbus qtserialport qtwebsockets qtwebchannel qtwebview qtpositioning qtlocation qtsensors qtspeech qtconnectivity qtvirtualkeyboard qtdoc qttranslations'
        type: string
      skip_modules:
        description: '要跳过的模块，空格分隔。默认跳过 qtopcua（Qt 6.8.x + MSVC 下 moc 生成的 QOpcUa::NodeIds 撑爆编译器限制，QTBUG-131516，Qt 6.9 才修复）与 qtconnectivity（Windows 版 QtBluetooth 只有 WinRT 后端，Win7 无 WinRT；且 MSVC 14.51 下 <experimental/coroutine> 已报 STL1011 硬错误）。清空该项可自行尝试'
        required: false
        default: 'qtopcua qtconnectivity'
        type: string
      openssl_mode:
        description: 'OpenSSL 链接方式（static=从源码静态编译）'
        required: false
        default: 'static'
        type: choice
        options: [static, none]
      openssl_version:
        description: 'OpenSSL 版本（仅 static 模式生效）'
        required: false
        default: '3.0.13'
        type: string
      ffmpeg_url:
        description: '可选：预编译 FFmpeg 前缀的 zip 包地址（配合 extra_modules 里的 qtmultimedia）'
        required: false
        default: ''
        type: string
      build_webengine:
        description: '额外编译 QtWebEngine + QtPdf（耗时数小时、需数十 GB 磁盘，建议自托管 runner）'
        required: false
        default: false
        type: boolean
      publish_release:
        description: '把产物发布/更新到 GitHub Release'
        required: false
        default: true
        type: boolean
      release_latest:
        description: '同时把该 Release 标记为 latest'
        required: false
        default: false
        type: boolean
      retention_days:
        description: '工作流构件保留天数'
        required: false
        default: '7'
        type: string
      runs_on:
        description: '运行器标签。默认 windows-2022（VS 2022 / MSVC 14.4x）——关键：VS2026 的 VC++ 运行库只支持 Win10+，用它编出来的 Qt 在 Win7 上无法运行；且 Qt 6.8.4 官方只验证到 MSVC 2022。也可填自托管 runner 标签，如 self-hosted, windows, x64'
        required: false
        default: 'windows-2022'
        type: string
      clean_build_dir:
        description: '安装后删除构建目录以释放磁盘'
        required: false
        default: false
        type: boolean
      timeout_minutes:
        description: '任务超时分钟数（GitHub 托管 runner 上限 360；自托管可填更大值）'
        required: false
        default: '360'
        type: string

permissions:
  contents: write

concurrency:
  group: qt6-win7-${{ inputs.qt_version }}-${{ inputs.arch }}
  cancel-in-progress: false

# 注意:工作流级 env 只允许 github / inputs / vars 三个上下文,
# runner.* 必须放到步骤里通过 $GITHUB_ENV 动态设置(见 "Set up paths" 步骤)。
env:
  QT_VERSION: ${{ inputs.qt_version }}
  QT_ARCH: ${{ inputs.arch }}

jobs:
  build:
    name: Qt ${{ inputs.qt_version }} (${{ inputs.arch }}, ${{ inputs.build_type }}, ${{ inputs.module_preset }})
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}

    steps:
      - name: Set up paths
        shell: pwsh
        run: |
          # runner.* 上下文只有步骤里能用,这里一次性算好并导出给后续所有步骤。
          $work = Join-Path $env:RUNNER_TEMP 'qt6-win7-work'
          @(
            "WORK_DIR=$work"
            "SRC_DIR=$work\src"
            "INSTALL_DIR=$work\install"
            "OPENSSL_DIR=$work\openssl"
            "DIST_DIR=$(Join-Path $env:RUNNER_TEMP 'qt6-win7-dist')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RUNNER_TEMP = $env:RUNNER_TEMP"
          Write-Host "WORK_DIR    = $work"
          Get-PSDrive -PSProvider FileSystem | ForEach-Object {
            Write-Host ("  drive {0}: {1:N1} GB free" -f $_.Name, ($_.Free / 1GB))
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Print build configuration
        shell: pwsh
        run: |
          $rows = @(
            '| 参数 | 值 |',
            '|---|---|',
            "| Qt 版本 | ``$env:QT_VERSION`` |",
            "| 架构 | ``${{ inputs.arch }}`` |",
            "| 构建类型 | ``${{ inputs.build_type }}`` |",
            "| 模块集 | ``${{ inputs.module_preset }}`` |",
            "| 补丁版本 | ``${{ inputs.patch_ref }}`` |",
            "| OpenSSL | ``${{ inputs.openssl_mode }} ${{ inputs.openssl_version }}`` |",
            "| QtWebEngine | ``${{ inputs.build_webengine }}`` |",
            "| 运行器 | ``${{ inputs.runs_on }}`` |",
            "| 触发者 | @${{ github.actor }} |"
          )
          $rows | ForEach-Object { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $_ }
          Write-Host "Building Qt $env:QT_VERSION for Windows 7 ($env:QT_ARCH)"

      - name: Verify toolchain
        shell: pwsh
        run: |
          $tools = @('git','cmake','ninja','perl','python','node','tar','7z','nmake')
          foreach ($t in $tools) {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            if ($c) { Write-Host ("{0,-8} {1}" -f $t, $c.Source) } else { Write-Host ("{0,-8} (missing)" -f $t) }
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path -LiteralPath $vswhere) {
            & $vswhere -latest -products * -property installationPath
            & $vswhere -latest -products * -property installationVersion
          }
          Write-Host "cores: $([Environment]::ProcessorCount)"

      - name: Ensure 7-Zip is available
        shell: pwsh
        run: |
          # Package-Qt 需要 7z 产出 .7z。官方 Windows 镜像一般都预装了 7-Zip，
          # 但别赌：找不到就先用常见安装路径找，再不行用 Chocolatey 装。
          $installDirs = @(
            "$env:ProgramFiles\7-Zip",
            "${env:ProgramFiles(x86)}\7-Zip"
          )
          $exe = @('7z', '7z.exe', '7za.exe') |
            Where-Object { Get-Command $_ -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $exe) {
            $exe = $installDirs | ForEach-Object { Join-Path $_ '7z.exe' } |
              Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if ($exe) { Write-Host "found 7z off-PATH at $exe" }
          }
          if (-not $exe) {
            Write-Host '7-Zip not found - installing via Chocolatey'
            choco install 7zip -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install 7zip failed (exit code $LASTEXITCODE)" }
            $global:LASTEXITCODE = 0
            $exe = $installDirs | ForEach-Object { Join-Path $_ '7z.exe' } |
              Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if (-not $exe) { throw '7-Zip still missing after the Chocolatey install' }
            # PATH 变更从下一个步骤开始生效,正好供 Package 步骤使用。
            Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $exe)
          }
          if (-not (Test-Path -LiteralPath $exe)) { throw "7z executable not usable: $exe" }
          Write-Host "7-Zip OK: $exe"

      - name: Fetch Qt source
        shell: pwsh
        run: |
          .\scripts\Fetch-QtSource.ps1 -Version $env:QT_VERSION -Destination $env:SRC_DIR -CacheRoot "$env:WORK_DIR\downloads"

      - name: Apply Windows 7 backport patches
        shell: pwsh
        run: |
          .\scripts\Apply-Win7Patches.ps1 `
            -SourceDir $env:SRC_DIR `
            -PatchRef '${{ inputs.patch_ref }}' `
            -WorkDir "$env:WORK_DIR\patches" `
            -ProvenanceFile "$env:WORK_DIR\win7-patches.json"

      - name: Cache OpenSSL
        if: inputs.openssl_mode == 'static'
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL_DIR }}
          key: openssl-${{ inputs.openssl_version }}-${{ inputs.arch }}-vs2022-v1

      - name: Build OpenSSL
        if: inputs.openssl_mode == 'static'
        shell: pwsh
        run: |
          .\scripts\Build-OpenSSL.ps1 -Version '${{ inputs.openssl_version }}' -Arch $env:QT_ARCH -Prefix $env:OPENSSL_DIR

      - name: Prepare FFmpeg (multimedia)
        if: inputs.ffmpeg_url != ''
        shell: pwsh
        run: |
          $dest = "$env:WORK_DIR\ffmpeg"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $zip = "$env:WORK_DIR\downloads\ffmpeg.zip"
          New-Item -ItemType Directory -Path (Split-Path $zip) -Force | Out-Null
          curl.exe -L --fail --retry 5 --retry-all-errors -o $zip "${{ inputs.ffmpeg_url }}"
          tar.exe -xf $zip -C $dest
          $root = if (Test-Path "$dest\include") { $dest } else { (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName }
          Write-Host "FFmpeg prefix: $root"
          "FFMPEG_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Qt
        shell: pwsh
        run: |
          $extra = @()
          if ($env:EXTRA_MODULES) { $extra += $env:EXTRA_MODULES.Split(' ', [StringSplitOptions]::RemoveEmptyEntries) }
          $skip = @()
          if ($env:SKIP_MODULES) { $skip += $env:SKIP_MODULES.Split(' ', [StringSplitOptions]::RemoveEmptyEntries) }
          $cmakeExtra = @()
          if ($env:EXTRA_CMAKE_ARGS) { $cmakeExtra += $env:EXTRA_CMAKE_ARGS.Split(' ', [StringSplitOptions]::RemoveEmptyEntries) }

          $params = @{
            SourceDir      = $env:SRC_DIR
            InstallDir     = $env:INSTALL_DIR
            Arch           = $env:QT_ARCH
            BuildType      = '${{ inputs.build_type }}'
            ModulePreset   = '${{ inputs.module_preset }}'
            ExtraModules   = $extra
            SkipModules    = $skip
            OpensslMode    = '${{ inputs.openssl_mode }}'
          }
          if ('${{ inputs.openssl_mode }}' -eq 'static') { $params.OpensslPrefix = $env:OPENSSL_DIR }
          if ($env:FFMPEG_DIR) { $params.FfmpegDir = $env:FFMPEG_DIR }
          if ($cmakeExtra.Count) { $params.ExtraCMakeArgs = $cmakeExtra }

          .\scripts\Configure-Qt.ps1 @params
        env:
          EXTRA_MODULES: ${{ inputs.extra_modules }}
          SKIP_MODULES: ${{ inputs.skip_modules }}
          EXTRA_CMAKE_ARGS: ${{ vars.QT_EXTRA_CMAKE_ARGS }}

      - name: Build and install Qt
        shell: pwsh
        run: |
          $params = @{
            SourceDir     = $env:SRC_DIR
            InstallDir    = $env:INSTALL_DIR
            BuildType     = '${{ inputs.build_type }}'
            Arch          = $env:QT_ARCH
          }
          if ('${{ inputs.build_webengine }}' -eq 'true') { $params.BuildWebEngine = $true }
          if ('${{ inputs.clean_build_dir }}' -eq 'true') { $params.CleanBuildDir = $true }
          .\scripts\Build-Qt.ps1 @params

      - name: Write build manifest
        shell: pwsh
        run: |
          $patchSha = 'n/a'
          $patchJson = "$env:WORK_DIR\win7-patches.json"
          if (Test-Path -LiteralPath $patchJson) {
            $j = Get-Content -LiteralPath $patchJson -Raw | ConvertFrom-Json
            $patchSha = $j.commit
          }
          $info = @(
            "Qt version          : $env:QT_VERSION"
            "Architecture        : ${{ inputs.arch }}"
            "Build type          : ${{ inputs.build_type }}"
            "Module preset       : ${{ inputs.module_preset }}"
            "Extra modules       : ${{ inputs.extra_modules }}"
            "Skipped modules     : ${{ inputs.skip_modules }}"
            "OpenGL backend      : desktop"
            "OpenSSL             : ${{ inputs.openssl_mode }} ${{ inputs.openssl_version }}"
            "QtWebEngine         : ${{ inputs.build_webengine }}"
            "Win7 patch repo     : https://github.com/crystalidea/qt6windows7"
            "Win7 patch ref      : ${{ inputs.patch_ref }}"
            "Win7 patch commit   : $patchSha"
            "Compiler            : Visual Studio 2022 (MSVC)"
            "Runner image        : ${{ runner.os }}"
            "Workflow            : $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "Source commit       : $env:GITHUB_SHA"
            "Built at (UTC)      : $((Get-Date).ToUniversalTime().ToString('o'))"
          )
          $info | Set-Content -LiteralPath "$env:WORK_DIR\BUILDINFO.txt" -Encoding utf8
          $info | ForEach-Object { Write-Host $_ }

      - name: Validate artifacts
        shell: pwsh
        run: |
          .\scripts\Test-Artifacts.ps1 -InstallDir $env:INSTALL_DIR -Arch $env:QT_ARCH

      - name: List shipped DLLs
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -LiteralPath "$env:INSTALL_DIR\bin" -Filter '*.dll' -ErrorAction SilentlyContinue
          Write-Host ("Qt DLLs in bin: {0}" -f $dlls.Count)
          $dlls | Select-Object -First 40 | ForEach-Object { Write-Host ("  {0}" -f $_.Name) }
          if ($dlls.Count -gt 40) { Write-Host ("  ... and {0} more" -f ($dlls.Count - 40)) }

      - name: Package
        id: package
        shell: pwsh
        run: |
          .\scripts\Package-Qt.ps1 `
            -InstallDir $env:INSTALL_DIR `
            -Version $env:QT_VERSION `
            -Arch $env:QT_ARCH `
            -OutDir $env:DIST_DIR `
            -InfoFile "$env:WORK_DIR\BUILDINFO.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: |
            ${{ steps.package.outputs.artifact-path }}
            ${{ steps.package.outputs.artifact-path }}.sha256
          retention-days: ${{ fromJSON(inputs.retention_days) }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.publish_release && success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.qt_version }}
          ARCH: ${{ inputs.arch }}
          DIST_DIR: ${{ env.DIST_DIR }}
          ARTIFACT_PATH: ${{ steps.package.outputs.artifact-path }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact-name }}
        run: |
          set -euo pipefail

          FILE="$ARTIFACT_PATH"
          NAME="$ARTIFACT_NAME"
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "找不到产物: $FILE"
            ls -la "$DIST_DIR"
            exit 1
          fi

          if [ "$ARCH" = "x64" ]; then SUFFIX=""; else SUFFIX="_${ARCH}"; fi
          TAG="v${VERSION}-win7${SUFFIX}"

          cat > notes.md <<EOF
          # Qt ${VERSION} for Windows 7 (${ARCH}, shared / Release)

          由 GitHub Actions 自动构建，Windows 7 兼容性补丁来自 [crystalidea/qt6windows7](https://github.com/crystalidea/qt6windows7)（\`${{ inputs.patch_ref }}\`）。Qt 编译为**动态库(shared/.dll)**，仅含社区开源模块，不含任何商业模块。

          | 项目 | 值 |
          |---|---|
          | Qt 版本 | ${VERSION} |
          | 架构 | ${ARCH} |
          | 构建类型 | ${{ inputs.build_type }} (动态库 / shared) |
          | 模块集 | ${{ inputs.module_preset }}（全部社区开源模块） |
          | OpenSSL | ${{ inputs.openssl_mode }} ${{ inputs.openssl_version }}（静态链接进 QtNetwork） |
          | QtWebEngine | ${{ inputs.build_webengine }} |
          | 编译器 | MSVC (Visual Studio 2022) |
          | 工作流 | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ## 使用

          \`\`\`bat
          mkdir "C:/Qt/${VERSION}-win7"
          7z x ${NAME} -o"C:/Qt/${VERSION}-win7"
          \`\`\`

          然后把 CMake 指向解开出来的前缀：

          \`\`\`bat
          cmake -S . -B build -DCMAKE_PREFIX_PATH="C:/Qt/${VERSION}-win7"
          cmake --build build --config Release
          \`\`\`

          发布程序时记得连同 \`bin/*.dll\` 与 \`plugins/platforms/qwindows.dll\` 一起带上。

          > GitHub 托管 runner 是 Windows Server，无法真正运行 Windows 7。
          > 发布前请务必在真实的 Windows 7 x64 机器上做一次冒烟测试。

          ## 校验

          \`\`\`
          $(cat "${FILE}.sha256")
          \`\`\`
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新同名资产"
            gh release upload "$TAG" "$FILE" "${FILE}.sha256" --clobber
          else
            gh release create "$TAG" "$FILE" "${FILE}.sha256" \
              --title "Qt ${VERSION} for Windows 7 (${ARCH}, shared)" \
              --notes-file notes.md
          fi

          if [ "${{ inputs.release_latest }}" = "true" ]; then
            gh release edit "$TAG" --latest
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_OUTPUT"

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Job result: ``${{ job.status }}``"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.qt_version }}-${{ inputs.arch }}
          path: |
            ${{ env.WORK_DIR }}\configure-command.txt
            ${{ env.WORK_DIR }}\win7-patches.json
            ${{ env.WORK_DIR }}\BUILDINFO.txt
          if-no-files-found: ignore
          retention-days: 14
